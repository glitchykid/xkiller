name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version' }
          if (-not (Test-Path "docs/releases/$version.md")) { throw 'Release notes are missing' }
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish executable and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $binary = "release/Xkiller-$version-x64.exe"
          gh release create "$env:GITHUB_REF_NAME" "$binary" release/SHA256SUMS.txt --verify-tag --title "Xkiller $version" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
