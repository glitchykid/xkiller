name: Verify and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Xkiller-Windows-x64
          path: release/*.exe
